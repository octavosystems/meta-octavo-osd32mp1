#UBOOT_SIGN_KEYNAME = "ubootfit"
# keys name for each image in keydir (eg. "ubootimg.crt", "ubootimg.key")
#UBOOT_SIGN_IMG_KEYNAME = "ubootimg"
# for signing individualiy each image on feit (kernel, dtb aka fdt)
#FIT_SIGN_INDIVIDUAL = "1"

#UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 2000"
#UBOOT_SIGN_ENABLE = "1"
